<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great Human Migration</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <!-- D3 full bundle (guarantees d3.geoMercator, d3.geoPath, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <!-- TopoJSON -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>The Great Human Migration</h1>
      <p>Five stories of how our ancestors traversed Asia — click a marker to explore</p>
    </header>

    <div class="map-area">
      <svg id="map-svg" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid slice"></svg>
    </div>

    <nav class="legend" id="legend"></nav>
  </div>

  <!-- Backdrop + Story panel -->
  <div class="overlay" id="overlay"></div>
  <aside class="story-panel" id="story-panel" aria-label="Migration story"></aside>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
